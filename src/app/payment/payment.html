<div class="payment-container">

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    Loading booking details...
  </div>

  <!-- Payment Content -->
  <div *ngIf="!loading && booking">

    <h1>Complete Your Payment</h1>
    <p class="subtitle">Secure checkout</p>

    <!-- Progress -->
    <div class="progress-bar">
      <div class="progress" style="width: 66%"></div>
    </div>

    <div class="steps">
      <span>Booking</span>
      <span class="active">Payment</span>
      <span>Confirmation</span>
    </div>

    <div class="payment-main">

      <!-- LEFT : Payment Form -->
      <div class="card payment-method">

        <h2>Card Details</h2>

        <form (ngSubmit)="payNow()">

          <!-- Card Holder Name -->
          <input
            type="text"
            [(ngModel)]="cardName"
            name="cardName"
            placeholder="Card Holder Name"
            required
            class="card-input"
          />

          <!-- Card Number -->
          <input
            type="text"
            [(ngModel)]="cardNumber"
            name="cardNumber"
            maxlength="16"
            placeholder="Card Number"
            inputmode="numeric"
            (input)="cardNumber = cardNumber.replace(/[^0-9]/g, '')"
            required
            class="card-input"
          />

          <!-- Expiry and CVV in a row -->
          <div class="expiry-cvc">

          <input
  type="text"
  [(ngModel)]="expiry"
  name="expiry"
  maxlength="5"
  placeholder="MM/YY"
  inputmode="numeric"
  (input)="formatExpiry()"
  required
  class="card-input"
/>


            <!-- CVV -->
            <input
              type="password"
              [(ngModel)]="cvv"
              name="cvv"
              maxlength="3"
              placeholder="CVV"
              inputmode="numeric"
              (input)="cvv = cvv.replace(/[^0-9]/g, '')"
              required
              class="card-input"
            />

          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="complete-btn"
            [disabled]="loading"
          >
            Pay Now
          </button>

          <div class="secure-note">
            <i>🔒</i>
            Secure SSL encrypted payment
          </div>

        </form>
      </div>

      <!-- RIGHT : Summary -->
      <!-- keep your existing summary code here -->

    </div>
  </div>
</div>
