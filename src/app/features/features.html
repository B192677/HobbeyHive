<div class="features-page">

  <!-- Header -->
  <div class="header">
    <h1>
      Unlock Your <br />
      <span>Potential</span>
    </h1>
    <p>
      Everything you need to master a new craft, designed for your lifestyle.
    </p>
  </div>

  <!-- Features Grid -->
  <div class="features-grid">
    <div class="feature-card" *ngFor="let f of features">
      <div class="icon">
        <span class="material-symbols-outlined">{{ f.icon }}</span>
      </div>
      <h3>{{ f.title }}</h3>
      <p>{{ f.description }}</p>
    </div>
  </div>

  <!-- Bottom Button -->
 

</div>
