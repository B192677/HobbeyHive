<div class="login-container">
  <div class="login-card">

    <!-- LEFT IMAGE -->
    <div class="login-image">
      <img src="images/painting.jpg" alt="Workshop Image">
      <div class="overlay">
        <blockquote>
          <p>
            "The beautiful thing about learning is that nobody can take it away from you."
          </p>
        </blockquote>
        <div class="quote-author">
          <div class="line"></div>
          <span>B.B. King</span>
        </div>
      </div>
    </div>

    <!-- RIGHT FORM -->
    <div class="login-form">

      <div class="branding">
        <h2>Hobby Hive</h2>
      </div>

      <div class="welcome-text">
        <p><b>Create your account to start exploring workshops.</b></p>
      </div>

      <form (ngSubmit)="registerUser()">

        <!-- NAME -->
        <div class="floating-group">
          <input type="text" [(ngModel)]="name" name="name" required />
          <label>Full Name</label>
        </div>

        <!-- EMAIL -->
        <div class="floating-group">
          <input type="email" [(ngModel)]="email" name="email" required />
          <label>Email Address</label>
        </div>

        <!-- PASSWORD -->
        <div class="floating-group password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
          />
          <label>Password</label>

          <button type="button" class="toggle-password" (click)="togglePassword()">
            <span class="material-symbols-outlined">
              {{ showPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>

        <!-- PASSWORD ERROR -->
        <p class="password-error" *ngIf="passwordInvalid">
          Password must include <b>letters, numbers, and symbols</b>.
        </p>

        <!-- CONFIRM PASSWORD -->
        <div class="floating-group password-wrapper">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
          />
          <label>Confirm Password</label>

          <button type="button" class="toggle-password" (click)="toggleConfirmPassword()">
            <span class="material-symbols-outlined">
              {{ showConfirmPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>

        <!-- TERMS -->
        <div class="actions">
          <label class="remember">
            <input type="checkbox" [(ngModel)]="acceptedTerms" name="acceptedTerms" />
            I agree to the
            <a routerLink="/terms">Terms</a> &
            <a routerLink="/privacypolicy">Privacy Policy</a>
          </label>
        </div>

        <!-- SUBMIT -->
        <button type="submit" class="sign-in-btn">Create Account</button>
      </form>

      <!-- LOGIN -->
      <div class="signup">
        <p>Already have an account?
          <a (click)="goToLogin()">Login</a>
        </p>
      </div>

    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" *ngIf="showPopup" [ngClass]="popupType">
    {{ popupMessage }}
  </div>
</div>
