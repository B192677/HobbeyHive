<div class="explore-hero">
  <h1>Explore Workshops</h1>
  <p>Discover workshops, activities, and passions you'll love</p>
</div>

<!-- Loading -->
<p *ngIf="loading" class="loading-text">Loading workshops...</p>

<!-- Empty -->
<p *ngIf="!loading && workshops.length === 0" class="empty-text">
  No workshops available
</p>

<!-- Workshop Cards -->
<div class="explore-grid" *ngIf="!loading && workshops.length > 0">
  <div class="cards-container">
    <div class="card" *ngFor="let w of workshops">
      <!-- Category Badge -->
      

      <div class="card-content">
        <h3>{{ w.title }}</h3>

        <div class="details">
          <span class="date">📅 {{ w.date }}  {{ w.time }}</span>
          <span class="location">📍 {{ w.location }}</span>
         
        </div>

        <p>{{ w.description }}</p>

        <button class="book-btn" (click)="openWorkshop(w.id)">View Details</button>
      </div>
    </div>
  </div>
