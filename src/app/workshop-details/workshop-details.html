<div class="workshop-details">

  <!-- Optional LOGOUT button (top-right) -->

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    Loading workshop details...
  </div>

  <!-- Workshop Content -->
  <div *ngIf="!loading && workshop">

    <h1>{{ workshop.title }}</h1>

    <!-- Image -->
    <img
      *ngIf="workshop.imageUrl"
      [src]="workshop.imageUrl"
      alt="{{ workshop.title }}"
    />

    <p class="description">
      {{ workshop.description }}
    </p>

    <div class="workshop-info">
      <p><strong>Workshop ID:</strong> {{ workshop.id }}</p>
      <p class="price">₹{{ workshop.price }}</p>
      <p *ngIf="workshop.date"><strong>Date:</strong> {{ workshop.date | date }}</p>
      <p *ngIf="workshop.location"><strong>Location:</strong> {{ workshop.location }}</p>
    </div>

    <button class="book-btn" type="button" (click)="bookWorkshop()">
      Book Now
    </button>

  </div>

  <!-- Not Found -->
  <div *ngIf="!loading && !workshop" class="loading">
    Workshop not found.
  </div>

</div>
