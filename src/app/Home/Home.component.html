



<section class="hero">
  <div class="hero-actions">
    <button routerLink="/login" class="primary-btn">GET STARTED</button>
  </div>
</section>

<section class="section-header">
  <h2>Upcoming Workshops</h2>
  <p>Browse and book your next learning session</p>
</section>

<section class="workshop-grid">
  <div
    class="workshop-card"
    *ngFor="let w of workshops"
    [routerLink]="['/workshop', w.id]"
  >
    <div class="badge">{{ w.category }}</div>
    <h3>{{ w.title }}</h3>
    <p class="meta">📅 {{ w.date }} • {{ w.time }}</p>
    <p class="meta">📍 {{ w.location }}</p>

    <div class="card-footer">
      <!-- <span class="seats">{{ w.seats }} seats left</span> -->
      <button class="secondary-btn">View Details</button>
    </div>
  </div>
</section>
