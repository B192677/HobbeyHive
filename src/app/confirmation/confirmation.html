<div class="confirmation-container">

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    Loading booking details...
  </div>

  <!-- Success Content -->
  <div *ngIf="!loading && booking">

    <!-- Success Message -->
    <div class="success-message">
      <div class="icon">🎉</div>
      <h2>Booking Confirmed!</h2>
      <p class="highlight">
        Thank you {{ userName }}, your booking was successful.
      </p>
    </div>

    <!-- Confirmation Card -->
    <div class="confirmation-card">

      <!-- Header -->
      <div class="booking-header">
        <span>Booking Details</span>
        <span class="booking-ref">ID: {{ booking.id }}</span>
      </div>

      <!-- Body -->
      <div class="card-body">

        <!-- Workshop Image -->
        

        <!-- Workshop Details -->
        <div class="workshop-details">
          <h3>{{ booking.title }}</h3>

          <div class="detail-row">
            <strong>Price:</strong> ₹{{ booking.price }}
          </div>

          <div class="detail-row">
            <strong>User:</strong> {{ userName }}
          </div>

          <div class="detail-row">
            <strong>Email:</strong> {{ booking.userEmail }}
          </div>

         
          <!-- Actions -->
          <div class="actions">
  <button (click)="goToExplore()">
    Back to Explore
  </button>

 
</div>



      </div>
    </div>

    <!-- Support -->
    <div class="support-note">
      Need help? Contact support@hobbyhive.com
    </div>

  </div>
</div>
